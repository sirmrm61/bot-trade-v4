services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # no host port — only reachable inside the compose network
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: bottrade
      POSTGRES_PASSWORD: bottrade
      POSTGRES_DB: bottrade
    volumes:
      - pg-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - app-data:/app/data
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # localhost only — public traffic enters via caddy
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # lets caddy reach host-published ports (e.g. omniroute on :20128)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  redis-data:
  pg-data:
  app-data:
  caddy-data:
  caddy-config:
